<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b8ff65">
  <title>Roma Music</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-dot"></span><span>ROMA</span><small>MUSIC</small></div>
    </header>

    <section class="hero">
      <p class="eyebrow">YOUR MUSIC SPACE</p>
      <h1>Find something<br><span>you'll love.</span></h1>
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Songs, artists, albums...">
        <button id="searchButton" class="search-button">Search</button>
      </div>
    </section>

    <section class="results-section">
      <div class="section-head">
        <h2 id="resultsTitle">Search results</h2>
        <span id="resultCount"></span>
      </div>
      <div id="results" class="results"></div>
      <div id="emptyState" class="empty-state">Search for a song or artist to get started.</div>
    </section>
  </main>

  <div id="miniPlayer" class="mini-player hidden">
    <button id="miniInfo" class="mini-info" aria-label="Open player">
      <img id="miniThumb" src="" alt="">
      <span><strong id="miniTitle">Nothing playing</strong><small id="miniArtist"></small></span>
    </button>
    <div class="mini-controls">
      <button id="prevButton" aria-label="Previous">‹</button>
      <button id="playPauseButton" class="play-button" aria-label="Play or pause">▶</button>
      <button id="nextButton" aria-label="Next">›</button>
    </div>
    <div class="mini-progress"><span id="miniProgress"></span></div>
  </div>

  <div id="fullPlayer" class="player-overlay" aria-hidden="true">
    <div class="player-panel">
      <button id="closePlayer" class="close-player" aria-label="Close">×</button>
      <img id="playerThumb" class="player-thumb" src="" alt="">
      <p class="now-playing-label">NOW PLAYING</p>
      <h2 id="playerTitle">Nothing playing</h2>
      <p id="playerArtist"></p>
      <div class="progress-row">
        <span id="currentTime">0:00</span>
        <input id="seekBar" type="range" min="0" max="100" value="0">
        <span id="totalTime">0:00</span>
      </div>
      <div class="player-controls">
        <button id="fullPrev">‹</button>
        <button id="fullPlay" class="main-play">▶</button>
        <button id="fullNext">›</button>
      </div>
    </div>
  </div>

  <audio id="audioPlayer" preload="metadata"></audio>
  <script src="/static/app.js"></script>
</body>
</html>
